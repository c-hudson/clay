# The native GUI's parity checklist: one row per thing the web GUI does.
#
# Sources of truth: app.js `handleMessage` (msg:*), app.js `dispatchActionImpl`
# (action:*), `WsMessage` in websocket.rs (wire:*), and the web window's features
# (ui:*). parity_tests.rs fails on any msg/action/wire id missing from this file or no
# longer in its source, so nothing the web GUI gains can be silently left out.
#
# status: done | todo | waived (with a note saying why) | see (wire rows of handled
# messages: their msg: row decides). phase: the plan's phase that delivers it (0 = n/a).
# Format: [[item]] blocks of `key = "value"` / `key = number` only.

