[package]
name = "clay"
version = "1.7.12"
edition = "2021"
rust-version = "1.89"

[dependencies]
ratatui = "0.26"
crossterm = { version = "0.27", features = ["event-stream"] }
tokio = { version = "1", features = ["full"] }
ansi-to-tui = "4"
bytes = "1"
strsim = "0.11"
socket2 = { version = "0.5", features = ["all"] }
unicode-width = "0.1"
# Shell worlds (src/shell): the PTY and terminal emulator. No serde: the screen crosses
# the wire as Clay's own ShellScreen rows, never as alacritty's types.
alacritty_terminal = { version = "0.26", default-features = false }
# alacritty_terminal reports PTY failures only through `log`; src/shell installs a logger
# that forwards them to debug.log.
log = "0.4"
regex = "1"
futures = "0.3"
aes-gcm = "0.10"
getrandom = "0.2"
base64 = "0.21"

# Self-signed certificate generation (pure Rust, same crypto as rustls)
rcgen = "0.14"

# TLS support - native-tls by default, rustls for static builds
tokio-native-tls = { version = "0.3", optional = true }
native-tls = { version = "0.2", optional = true }
# default-features = false + explicit "ring" feature: rustls 0.23 defaults its
# crypto provider to aws-lc-rs, which needs a C toolchain and does not
# cross-compile cleanly to Android armv7 (breaks the Termux build). ring
# cross-compiles fine and is what Clay has always used. Every TLS dep below
# must stay pinned to ring the same way - see TofuVerifier in platform.rs.
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = ["logging", "tls12", "ring"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "logging", "std", "tls12"] }
webpki-roots = { version = "0.26", optional = true }

# WebSocket support (TLS features are conditional on backend)
tokio-tungstenite = "0.24"

# Serialization for WebSocket protocol
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Password hashing for WebSocket authentication
sha2 = "0.10"
hex = "0.4"

# Async recursion support for Rust 1.75
async-recursion = "1.0"

# Originally capped for Rust 1.75 compatibility. rust-version is 1.89 now, and
# the caps on indexmap and home blocked the native-gui deps (gpui needs indexmap
# >= 2.7), so only the floors remain.
indexmap = ">=2.2.0"
url = ">=2.5.4"
hashbrown = "0.14"
home = "0.5.5"
time = ">=0.3.37"

# MCCP2 (MUD Client Compression Protocol) zlib decompression
flate2 = "1"

# HTTP client for Slack/Discord APIs
# "rustls-tls" here resolves to reqwest's "rustls-tls-webpki-roots" feature, which
# pulls in "__rustls-ring" - the ring-based crypto provider variant. This unifies
# with our direct rustls/tokio-rustls deps above on the same ring-backed rustls
# 0.23, keeping aws-lc-rs out of the build (see the comment on tokio-rustls above).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }

# UUID for Edge TTS request IDs
uuid = { version = "1", features = ["v4"] }
# Kokoro TTS (src/kokoro.rs): the sherpa-onnx runtime is downloaded at runtime and loaded
# with libloading; its tarballs and the model's are .tar.bz2 (pure-Rust bzip2 backend).
libloading = "0.8"
tar = "0.4"
bzip2 = "0.6"   # its default backend is the pure-Rust libbz2-rs-sys

# Long-term output archive (scrollback storage)
rusqlite = { version = "0.31", features = ["bundled"] }

# SSH-tunneled transport for --console/--gui (optional, see src/ssh.rs).
# default-features = false + "ring": same crypto-backend policy as rustls/tokio-rustls
# above - russh's default pulls aws-lc-rs, which needs a C toolchain and does not
# cross-compile to Android/Termux armv7. ring is pure-Rust and matches everything else.
russh = { version = "0.63", optional = true, default-features = false, features = ["ring", "rsa"] }
igd-next = { version = "0.17.1", default-features = false, features = ["aio_tokio"] }

# Native GUI (optional, `native-gui` feature, branch native-gui): Zed's GPUI
# framework plus Longbridge's gpui-component widgets. gpui-pre is the weekly
# crates.io snapshot of Zed's main branch, so these are pinned exactly - its API
# moves between snapshots. Needs a much newer rustc than rust-version above;
# only `--features native-gui` builds use it. runtime_shaders compiles the Metal
# shaders when the app starts, so macOS builds need no full Xcode.
gpui = { package = "gpui-pre", version = "=0.3.8", optional = true }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", optional = true, features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui-component = { version = "=0.7.1", optional = true }
# gpui-component's own icons (the input's eye, a menu's check mark), served beside ours.
gpui-kit-assets = { version = "=0.7.1", optional = true }
# Output-view line wrapping (UAX #14 break opportunities, grapheme boundaries).
unicode-linebreak = { version = "0.1.5", optional = true }
unicode-segmentation = { version = "1.12", optional = true }
# Emoji_Presentation and friends: which clusters the browser draws from the colour
# emoji font.
unicode-properties = { version = "0.1.4", optional = true, default-features = false, features = ["emoji"] }
# Bidi classes: rows holding right-to-left text are reshaped on their own for display.
unicode-bidi = { version = "0.3", optional = true }
# Discord emoji (PNG, animated GIF) decoded for the output view, and
# --gui-snapshot's PNG output. The same image crate GPUI uses.
image = { version = "0.25", optional = true, default-features = false, features = ["png", "gif"] }
# Glyph outlines of the bundled JetBrains Mono: where an underline skips the ink of
# descenders (CSS text-decoration-skip-ink). Already in the tree through GPUI.
ttf-parser = { version = "0.25", optional = true, default-features = false, features = ["std"] }
# native-gui: the X11 window id, to set its opacity (the settings' Transparency).
raw-window-handle = { version = "0.6", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
# Audio playback (optional, requires ALSA dev libraries on Linux)
rodio = { version = "0.17", optional = true, default-features = false, features = ["wav", "mp3", "vorbis", "flac"] }
# WebView GUI (native WebView window using system browser engine)
wry = { version = "0.48", optional = true }
tao = { version = "0.34", optional = true }
webkit2gtk = { version = "2.0", optional = true }
gdk = { version = "0.18", optional = true }
gtk = { version = "0.18", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# Shell worlds surviving /reload (src/shell/adopt.rs): to re-attach the PTY of a shell
# world across the exec, an AdoptedPty implements alacritty_terminal's EventedReadWrite/
# EventedPty, whose trait methods take `polling` types - so we reference the same crate
# alacritty resolves (already in the tree; this just names it). Linux-only (uses pidfd to
# watch the adopted child); other platforms close shell worlds on reload.
polling = "3"
# Used only to probe whether the AT-SPI accessibility bus is reachable before
# GTK's atk-bridge loads (see webview_gui.rs::disable_a11y_bridge_if_broken) -
# both already resolved transitively via gtk, this just lets us call them
# directly.
gio = { version = "0.18", optional = true }
glib = { version = "0.18", optional = true }
# dbind (the library GTK's atk-bridge actually uses to find the AT-SPI bus)
# resolves the address primarily from an X11 root-window property, not from
# asking the session D-Bus - see webview_gui.rs::a11y_bus_address_x11. Pure
# Rust XCB client, no libX11 linkage needed.
x11rb = { version = "0.14", optional = true }
# native-gui: a look at the Vulkan devices before GPUI starts (native_gui::vulkan_is_software_only).
# The version GPUI renders with, already in the tree through it.
wgpu = { version = "29.0.4", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# native-gui: turns off CoreGraphics-style glyph thickening for the process, as the web
# client's `-webkit-font-smoothing: antialiased` does in WKWebView.
core-foundation = { version = "0.10", optional = true }
core-foundation-sys = { version = "0.8", optional = true }
# The native GUI's spell checking on macOS (the same AppKit versions GPUI uses).
objc2-app-kit = { version = "0.3", optional = true, default-features = false, features = ["std", "NSSpellChecker"] }
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = ["std", "NSString", "NSArray", "NSRange"] }
# Audio playback (uses CoreAudio on macOS automatically)
rodio = { version = "0.17", optional = true, default-features = false, features = ["wav", "mp3", "vorbis", "flac"] }
# WebView GUI (native WebView window using system browser engine)
wry = { version = "0.48", optional = true }
tao = { version = "0.34", optional = true }

[target.'cfg(windows)'.dependencies]
# The native GUI's spell checking on Windows (ISpellChecker; the windows version GPUI uses).
# Also its title bars' dark mode (ui/titlebar.rs: DwmSetWindowAttribute, SetWindowPos).
windows = { version = "0.62", optional = true, features = ["Win32_Globalization", "Win32_System_Com", "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging"] }
# Audio playback (uses WASAPI on Windows automatically)
rodio = { version = "0.17", optional = true, default-features = false, features = ["wav", "mp3", "vorbis", "flac"] }
# WebView GUI (native WebView window using system browser engine)
wry = { version = "0.48", optional = true }
tao = { version = "0.34", optional = true }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

# test-util (Sleep::reset/tokio::time::pause+advance) is only needed for
# `cargo test` — declaring it here rather than adding it to the main tokio
# dependency above keeps it out of the production binary. Cargo unifies this
# into the feature set for test/bench targets only, not `cargo build`'s
# "clay" bin target. Added for src/telnet_reader.rs's idle-flush test (plan
# Job 4, investigate-differences-between-tinyfugu-fluffy-stallman.md).
[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[features]
default = ["rustls-backend", "native-audio", "ssh-transport"]
native-tls-backend = ["tokio-native-tls", "native-tls", "tokio-tungstenite/native-tls"]
rustls-backend = ["tokio-rustls", "rustls", "webpki-roots", "tokio-tungstenite/rustls-tls-webpki-roots"]
native-audio = ["rodio"]
webview-gui = ["wry", "tao", "webkit2gtk", "gdk", "gtk", "gio", "glib", "x11rb"]
ssh-transport = ["russh"]
native-gui = ["gpui", "gpui_platform", "gpui-component", "gpui-kit-assets", "unicode-linebreak", "unicode-segmentation", "unicode-properties", "unicode-bidi", "core-foundation", "core-foundation-sys", "image", "ttf-parser", "objc2-app-kit", "objc2-foundation", "windows", "raw-window-handle", "x11rb", "wgpu"]
# Offscreen rendering of the native GUI to PNG, for comparisons against the WebView.
native-gui-snapshot = ["native-gui", "gpui/test-support", "gpui_platform/test-support"]

[[bin]]
name = "clay-test-server"
path = "src/bin/clay-test-server.rs"

# Native GUI (branch native-gui): GPUI's Linux text system with one fix so the colour
# emoji font can be requested by name. See vendor/gpui-pre-wgpu/CLAY-PATCH.md.
[patch.crates-io]
gpui-pre-wgpu = { path = "vendor/gpui-pre-wgpu" }

# Debug builds default to full DWARF debug info (`debug = 2`), which is the bulk of
# `target/*/debug` - tens of GB of dependency symbols across every debug target dir.
# `line-tables-only` keeps backtraces with file/line numbers (enough for almost all
# debugging here) but drops the heavy variable/type info, roughly halving the debug
# artifacts. Release builds are unaffected (that is `[profile.release]`), so `/release`
# output is unchanged. Bump this back to `2` temporarily if you need deep gdb inspection.
[profile.dev]
debug = "line-tables-only"
